name: obol
version: 0.1.1+teamshift.1
description: "Safe invoicing for freelancers, consultants and agencies who bill clients, from any chat. The assistant drafts invoices (also from forwarded messages), sends them as Stripe payment links or as bank-transfer PDF invoices with no provider account, and tracks who has paid. Every invoice write needs your approval, with checks for prompt injection, lookalike and impersonated client addresses, duplicates, unusual amounts and changed payout details, plus hash-chained logs. Test mode by default."
author: UEddy
requires_hermes: ">=0.22"
provides_tools:
  - obol_create_invoice
  - obol_send_invoice
  - obol_get_invoice
  - obol_list_invoices
  - obol_send_reminder
  - obol_void_invoice
  - obol_mark_paid
  - obol_draft_from_message
provides_hooks:
  - pre_tool_call
# Optional: only Stripe mode uses it. Bank-transfer mode (provider: bank_transfer) needs no key.
# Each workspace sets its OWN restricted key; it is read only through the engine's profile-scoped
# secret route. A full live secret key (sk_live_) is always refused.
optional_env:
  - name: OBOL_STRIPE_RESTRICTED_KEY
    description: "This workspace's own Stripe restricted key, for Stripe mode only. rk_test_ (or sk_test_) to try it; rk_live_ for real invoices, and only when allow_live is on. sk_live_ keys are refused."
    url: "https://dashboard.stripe.com/apikeys"
    secret: true
config_schema:
  stripe_api_key:
    type: secret
    env: OBOL_STRIPE_RESTRICTED_KEY
    label: "Stripe restricted key"
    description: "This workspace's own restricted key (rk_test_... or rk_live_...). Stored with the workspace's secrets, never in config.yaml. Full sk_live_ keys are refused."
  allow_live:
    type: bool
    default: false
    label: "Allow live mode"
    description: "Off: live Stripe keys are refused, so no real customer is ever billed. On: a restricted live key (rk_live_) is accepted; a full sk_live_ key never is."
  default_currency:
    type: str
    default: usd
    label: "Default currency"
  default_days_until_due:
    type: int
    default: 14
    label: "Days until due"
  risk_duplicate_window_days:
    type: int
    default: 30
    label: "Risk check: duplicate window (days)"
    description: "Flag an invoice with the same customer and amount as one created within this many days. 0 turns it off."
  risk_amount_multiplier:
    type: float
    default: 3.0
    label: "Risk check: unusual amount (x average)"
    description: "Flag an invoice above this multiple of the customer's average invoice. 0 turns it off."
  risk_amount_min_history:
    type: int
    default: 3
    label: "Risk check: invoices needed for an average"
    description: "How many past invoices a customer needs before the unusual-amount check applies."
  risk_contact_change_days:
    type: int
    default: 14
    label: "Risk check: recent contact/payment change (days)"
    description: "Flag when the customer's email or payment details changed in Stripe this recently. 0 turns it off. Max 30 (Stripe keeps 30 days of events)."
  risk_lookalike_domains:
    type: bool
    default: true
    label: "Risk check: lookalike domains"
    description: "Flag a billing email whose domain imitates one you've billed (acrnestudio.example vs acmestudio.example)."
  risk_impersonation:
    type: bool
    default: true
    label: "Risk check: known client, new domain"
    description: "Flag a client name you've billed before when the email is at a domain you've never used for them."
  provider:
    type: str
    default: "stripe"
    label: "Payment provider"
    description: "stripe: hosted payment link, card payments. bank_transfer: a PDF invoice with your bank details; Obol makes no network calls and emails nobody (you send the PDF). Record payments with obol_mark_paid."
  business_name:
    type: str
    default: ""
    label: "Business name (bank-transfer invoices)"
    description: "Printed at the top of PDF invoices. Defaults to the account name."
  bank_account_name:
    type: str
    default: ""
    label: "Bank account name"
    description: "Printed on bank-transfer invoices. A change is flagged on your next invoice."
  bank_name:
    type: str
    default: ""
    label: "Bank name"
    description: "Printed on bank-transfer invoices."
  bank_account_number:
    type: str
    default: ""
    label: "Bank account number"
    description: "Printed on bank-transfer invoices. A change is flagged on your next invoice."
  bank_routing:
    type: str
    default: ""
    label: "Routing / sort code / IBAN / SWIFT"
    description: "Printed on bank-transfer invoices. A change is flagged on your next invoice."
